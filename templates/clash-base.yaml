# 沿用当前 Subconverter 的基础监听设置；规则、策略组仍由 meta.ini 生成。
port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# DNS 开关、监听、Fake-IP、普通网站和直连解析继续由客户端配置。
# 使用时须保持客户端 DNS 已启用，并在覆写后保留以下域名策略。
dns:
  # 节点策略要求此项非空；沿用现有节点解析使用的国内 IP DoH。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver-policy:
    '+.eixcloud.com':
      - https://zone.rlose.com:39933/api-query#DIRECT
      - https://radar.rlose.com/api-query#DIRECT
  # 也覆盖客户端通过 DNS 入口查询该节点域名的情况。
  nameserver-policy:
    '+.eixcloud.com':
      - https://zone.rlose.com:39933/api-query#DIRECT
      - https://radar.rlose.com/api-query#DIRECT
